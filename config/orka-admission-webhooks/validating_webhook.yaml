apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: orka-admission
  labels:
    app.kubernetes.io/name: orka
    app.kubernetes.io/component: admission
    app.kubernetes.io/managed-by: kustomize
  annotations:
    cert-manager.io/inject-ca-from-secret: orka-system/orka-admission-tls
# The controller identities in matchConditions must remain identical to the
# corresponding orka-admission command argument. Patch the platform-owned
# runtime and webhook configuration atomically when using noncanonical release
# namespaces or ServiceAccount names.
webhooks:
  - name: namespaceexecutionmode.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-v1-namespace-execution-mode, port: 443}
    rules:
      - {operations: [CREATE, UPDATE], apiGroups: [""], apiVersions: [v1], resources: [namespaces], scope: Cluster}
    matchConditions:
      - name: execution-mode-claim-present
        expression: >-
          object.metadata.?labels.orValue({}).exists(k, k == 'orka.ai/controller-mode') ||
          oldObject.?metadata.?labels.orValue({}).exists(k, k == 'orka.ai/controller-mode')
  - name: workspaceattachmentsecret.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-v1-secret-workspace-attachment, port: 443}
    rules:
      - {operations: [CREATE, UPDATE, DELETE], apiGroups: [""], apiVersions: [v1], resources: [secrets], scope: Namespaced}
    objectSelector:
      matchExpressions:
        - key: workspace.orka.ai/attachment-for
          operator: Exists
  - name: acpsuspendquotalease.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-coordination-k8s-io-v1-acp-suspend-quota-lease, port: 443}
    rules:
      - {operations: [CREATE, UPDATE, DELETE], apiGroups: [coordination.k8s.io], apiVersions: [v1], resources: [leases], scope: Namespaced}
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: orka-system
    matchConditions:
      - name: reserved-acp-workspace-lease-name
        expression: >-
          request.?name.orValue('').startsWith('acp-suspend-quota-') ||
          request.?name.orValue('').startsWith('acp-retention-fence-') ||
          (request.operation == 'CREATE' &&
          (object.metadata.?generateName.orValue('').startsWith('acp-suspend-quota-') ||
          object.metadata.?generateName.orValue('').startsWith('acp-retention-fence-')))
  - name: taskprovenance.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-core-orka-ai-v1alpha1-task-provenance, port: 443}
    rules:
      - {operations: [CREATE, UPDATE], apiGroups: [core.orka.ai], apiVersions: [v1alpha1], resources: [tasks, tasks/status], scope: Namespaced}
    matchConditions:
      - name: route-unless-controller-cleanup-safe
        expression: >-
          !((request.userInfo.username == 'system:serviceaccount:orka-system:orka-controller-manager' ||
          request.userInfo.username == 'system:serviceaccount:orka-v1-system:orka-v1' ||
          request.userInfo.username == 'system:serviceaccount:orka-v2-system:orka-v2') &&
          request.operation == 'UPDATE' &&
          has(oldObject.metadata.deletionTimestamp) &&
          has(object.metadata.deletionTimestamp) &&
          object.metadata.deletionTimestamp == oldObject.metadata.deletionTimestamp &&
          oldObject.metadata.?finalizers.orValue([]).exists(f, f == 'orka.ai/cleanup') &&
          !object.metadata.?finalizers.orValue([]).exists(f, f == 'orka.ai/cleanup') &&
          object.metadata.?finalizers.orValue([]) ==
          oldObject.metadata.?finalizers.orValue([]).filter(f, f != 'orka.ai/cleanup') &&
          object.apiVersion == oldObject.apiVersion &&
          object.kind == oldObject.kind &&
          object.spec == oldObject.spec &&
          object.?status.orValue({}) == oldObject.?status.orValue({}) &&
          object.metadata.name == oldObject.metadata.name &&
          object.metadata.?generateName.orValue('') == oldObject.metadata.?generateName.orValue('') &&
          object.metadata.namespace == oldObject.metadata.namespace &&
          object.metadata.uid == oldObject.metadata.uid &&
          object.metadata.resourceVersion == oldObject.metadata.resourceVersion &&
          object.metadata.generation == oldObject.metadata.generation &&
          object.metadata.creationTimestamp == oldObject.metadata.creationTimestamp &&
          object.metadata.?deletionGracePeriodSeconds.orValue(0) ==
          oldObject.metadata.?deletionGracePeriodSeconds.orValue(0) &&
          object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
          object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) &&
          object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
          object.metadata.?managedFields.orValue([]) == oldObject.metadata.?managedFields.orValue([]))
  - name: taskworkspaceclassuse.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-core-orka-ai-v1alpha1-task-workspace-class-use, port: 443}
    rules:
      - {operations: [CREATE, UPDATE], apiGroups: [core.orka.ai], apiVersions: [v1alpha1], resources: [tasks], scope: Namespaced}
    matchConditions:
      - name: route-unless-controller-cleanup-safe
        expression: >-
          !((request.userInfo.username == 'system:serviceaccount:orka-system:orka-controller-manager' ||
          request.userInfo.username == 'system:serviceaccount:orka-v1-system:orka-v1' ||
          request.userInfo.username == 'system:serviceaccount:orka-v2-system:orka-v2') &&
          request.operation == 'UPDATE' &&
          has(oldObject.metadata.deletionTimestamp) &&
          has(object.metadata.deletionTimestamp) &&
          object.metadata.deletionTimestamp == oldObject.metadata.deletionTimestamp &&
          oldObject.metadata.?finalizers.orValue([]).exists(f, f == 'orka.ai/cleanup') &&
          !object.metadata.?finalizers.orValue([]).exists(f, f == 'orka.ai/cleanup') &&
          object.metadata.?finalizers.orValue([]) ==
          oldObject.metadata.?finalizers.orValue([]).filter(f, f != 'orka.ai/cleanup') &&
          object.apiVersion == oldObject.apiVersion &&
          object.kind == oldObject.kind &&
          object.spec == oldObject.spec &&
          object.?status.orValue({}) == oldObject.?status.orValue({}) &&
          object.metadata.name == oldObject.metadata.name &&
          object.metadata.?generateName.orValue('') == oldObject.metadata.?generateName.orValue('') &&
          object.metadata.namespace == oldObject.metadata.namespace &&
          object.metadata.uid == oldObject.metadata.uid &&
          object.metadata.resourceVersion == oldObject.metadata.resourceVersion &&
          object.metadata.generation == oldObject.metadata.generation &&
          object.metadata.creationTimestamp == oldObject.metadata.creationTimestamp &&
          object.metadata.?deletionGracePeriodSeconds.orValue(0) ==
          oldObject.metadata.?deletionGracePeriodSeconds.orValue(0) &&
          object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
          object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) &&
          object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
          object.metadata.?managedFields.orValue([]) == oldObject.metadata.?managedFields.orValue([]))
  - name: toolworkspaceclassuse.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-core-orka-ai-v1alpha1-tool-workspace-class-use, port: 443}
    rules:
      - {operations: [CREATE, UPDATE], apiGroups: [core.orka.ai], apiVersions: [v1alpha1], resources: [tools], scope: Namespaced}
  - name: agentcontract.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-core-orka-ai-v1alpha1-agent-contract, port: 443}
    rules:
      - {operations: [CREATE, UPDATE], apiGroups: [core.orka.ai], apiVersions: [v1alpha1], resources: [agents], scope: Namespaced}
  - name: agentruntimecontract.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-core-orka-ai-v1alpha1-agentruntime-contract, port: 443}
    rules:
      - {operations: [CREATE, UPDATE], apiGroups: [core.orka.ai], apiVersions: [v1alpha1], resources: [agentruntimes], scope: Namespaced}
  - name: taskexecutionauthority.core.orka.ai
    admissionReviewVersions: [v1]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    timeoutSeconds: 10
    clientConfig:
      service: {name: orka-admission, namespace: orka-system, path: /validate-core-orka-ai-v1alpha1-task-execution-authority, port: 443}
    rules:
      - {operations: [CREATE, UPDATE], apiGroups: [core.orka.ai], apiVersions: [v1alpha1], resources: [tasks, tasks/status], scope: Namespaced}
    matchConditions:
      - name: route-unless-controller-cleanup-safe
        expression: >-
          !((request.userInfo.username == 'system:serviceaccount:orka-system:orka-controller-manager' ||
          request.userInfo.username == 'system:serviceaccount:orka-v1-system:orka-v1' ||
          request.userInfo.username == 'system:serviceaccount:orka-v2-system:orka-v2') &&
          request.operation == 'UPDATE' &&
          has(oldObject.metadata.deletionTimestamp) &&
          has(object.metadata.deletionTimestamp) &&
          object.metadata.deletionTimestamp == oldObject.metadata.deletionTimestamp &&
          oldObject.metadata.?finalizers.orValue([]).exists(f, f == 'orka.ai/cleanup') &&
          !object.metadata.?finalizers.orValue([]).exists(f, f == 'orka.ai/cleanup') &&
          object.metadata.?finalizers.orValue([]) ==
          oldObject.metadata.?finalizers.orValue([]).filter(f, f != 'orka.ai/cleanup') &&
          object.apiVersion == oldObject.apiVersion &&
          object.kind == oldObject.kind &&
          object.spec == oldObject.spec &&
          object.?status.orValue({}) == oldObject.?status.orValue({}) &&
          object.metadata.name == oldObject.metadata.name &&
          object.metadata.?generateName.orValue('') == oldObject.metadata.?generateName.orValue('') &&
          object.metadata.namespace == oldObject.metadata.namespace &&
          object.metadata.uid == oldObject.metadata.uid &&
          object.metadata.resourceVersion == oldObject.metadata.resourceVersion &&
          object.metadata.generation == oldObject.metadata.generation &&
          object.metadata.creationTimestamp == oldObject.metadata.creationTimestamp &&
          object.metadata.?deletionGracePeriodSeconds.orValue(0) ==
          oldObject.metadata.?deletionGracePeriodSeconds.orValue(0) &&
          object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
          object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) &&
          object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
          object.metadata.?managedFields.orValue([]) == oldObject.metadata.?managedFields.orValue([]))
