---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.0
  name: agentruntimes.core.orka.ai
spec:
  group: core.orka.ai
  names:
    kind: AgentRuntime
    listKind: AgentRuntimeList
    plural: agentruntimes
    singular: agentruntime
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    - jsonPath: .spec.contractVersion
      name: Contract
      type: string
    - jsonPath: .spec.deployment.mode
      name: Mode
      type: string
    - jsonPath: .status.observedCapabilities.runtimeInstanceID
      name: Instance
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRuntime is the Schema for registered external Orka harness
          runtimes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentRuntimeRegistrySpec defines the desired state of a registered Orka harness runtime.
              The dual schema has no contractVersion default: omission is tolerated only for
              stored objects awaiting the one-time bridge classification and is never
              interpreted as either protocol. Fail-closed admission requires an explicit
              value for new registrations.
            properties:
              capabilities:
                description: |-
                  Capabilities pins the runtime capability claims. Required with the exact
                  instance/profile/limits/governance shape for orka.harness.v2; historically
                  optional for orka.harness.v1.
                properties:
                  brokeredToolClasses:
                    description: |-
                      BrokeredToolClasses lists the harness v1 brokered tool classes supported
                      by the runtime. v1 only; historically optional.
                    items:
                      description: |-
                        AgentRuntimeBrokeredToolClass classifies Tool CRDs. It is shared by the Tool
                        API and by harness v1 AgentRuntime capability declarations.
                      enum:
                      - read
                      - write
                      - coordination
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  limits:
                    description: Limits must exactly match /v2/capabilities. v2 only.
                    properties:
                      maxBufferedEvents:
                        format: int32
                        minimum: 1
                        type: integer
                      maxConcurrentPrompts:
                        format: int32
                        minimum: 1
                        type: integer
                      maxEventLineBytes:
                        format: int32
                        minimum: 1
                        type: integer
                      maxPendingPermissions:
                        format: int32
                        minimum: 1
                        type: integer
                      maxPromptLeaseMillis:
                        format: int64
                        minimum: 1
                        type: integer
                      maxRequestBytes:
                        format: int32
                        minimum: 1
                        type: integer
                      maxResidentSessions:
                        format: int32
                        minimum: 1
                        type: integer
                      maxTerminalResultBytes:
                        format: int32
                        minimum: 1
                        type: integer
                      maxUpdateEventsPerSecond:
                        format: int32
                        minimum: 1
                        type: integer
                      maxWorkspaceDeltaBytes:
                        format: int64
                        minimum: 1
                        type: integer
                      minPromptLeaseMillis:
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - maxBufferedEvents
                    - maxConcurrentPrompts
                    - maxEventLineBytes
                    - maxPendingPermissions
                    - maxPromptLeaseMillis
                    - maxRequestBytes
                    - maxResidentSessions
                    - maxTerminalResultBytes
                    - maxUpdateEventsPerSecond
                    - maxWorkspaceDeltaBytes
                    - minPromptLeaseMillis
                    type: object
                  mcpPolicy:
                    description: |-
                      MCPPolicy materializes the exact policy represented by the profile's MCP
                      digests so readiness conformance and Task dispatch use identical inputs.
                    properties:
                      allowBash:
                        description: AllowBash controls whether an allowed tool named
                          Bash may execute.
                        type: boolean
                      allowedTools:
                        description: |-
                          AllowedTools is the canonical sorted allowlist exposed through the
                          prompt-scoped MCP broker.
                        items:
                          maxLength: 128
                          minLength: 1
                          type: string
                        maxItems: 128
                        type: array
                      approvalRequiredTools:
                        description: |-
                          ApprovalRequiredTools must remain an explicit empty list until the
                          controller owns external-runtime permission review.
                        items:
                          maxLength: 128
                          minLength: 1
                          type: string
                        maxItems: 0
                        type: array
                      disallowedTools:
                        description: DisallowedTools is the canonical sorted deny
                          list applied after the allowlist.
                        items:
                          maxLength: 128
                          minLength: 1
                          type: string
                        maxItems: 128
                        type: array
                    required:
                    - allowBash
                    - allowedTools
                    - approvalRequiredTools
                    - disallowedTools
                    type: object
                  profile:
                    description: Profile is the exact immutable profile accepted by
                      v2 session creation.
                    properties:
                      acpProfile:
                        description: ACPProfile is the reviewed ACP profile.
                        enum:
                        - acp.v1
                        type: string
                      adapterDigest:
                        description: AdapterDigest pins the adapter/CLI artifact set.
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      adapterName:
                        description: AdapterName identifies the sole adapter contained
                          by this external profile.
                        maxLength: 128
                        minLength: 1
                        type: string
                      agentConfigurationDigest:
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      approvalPolicyDigest:
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      digest:
                        description: Digest is the canonical orka.harness.v2 runtime-profile
                          digest.
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      digestSchemaVersion:
                        description: DigestSchemaVersion identifies the canonical
                          profile digest schema.
                        enum:
                        - 1
                        format: int32
                        type: integer
                      mcpConfigurationDigest:
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      model:
                        maxLength: 256
                        minLength: 1
                        type: string
                      modelLimits:
                        description: ModelLimits pins optional reviewed model token
                          capacities.
                        properties:
                          context:
                            description: Context is the maximum model context capacity
                              in tokens.
                            format: int64
                            minimum: 1
                            type: integer
                          output:
                            description: Output is the maximum generated output in
                              tokens.
                            format: int64
                            minimum: 1
                            type: integer
                        required:
                        - context
                        - output
                        type: object
                        x-kubernetes-validations:
                        - message: model context limit must exceed output limit
                          rule: self.context > self.output
                      providerKind:
                        maxLength: 128
                        minLength: 1
                        type: string
                      proxyCredentialRole:
                        maxLength: 256
                        minLength: 1
                        type: string
                      proxyCredentialScope:
                        maxLength: 1024
                        minLength: 1
                        type: string
                      resourceClass:
                        maxLength: 128
                        minLength: 1
                        type: string
                      toolPolicyDigest:
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                      workspaceIntent:
                        description: WorkspaceIntent is the one immutable strict intent
                          represented by this profile.
                        enum:
                        - read
                        - write
                        type: string
                    required:
                    - acpProfile
                    - adapterDigest
                    - adapterName
                    - agentConfigurationDigest
                    - approvalPolicyDigest
                    - digest
                    - digestSchemaVersion
                    - mcpConfigurationDigest
                    - model
                    - providerKind
                    - proxyCredentialRole
                    - proxyCredentialScope
                    - resourceClass
                    - toolPolicyDigest
                    - workspaceIntent
                    type: object
                  runtimeInstanceID:
                    description: |-
                      RuntimeInstanceID is the immutable external supervisor instance expected from
                      authenticated /v2/status and every conformance response. v2 only.
                    maxLength: 253
                    minLength: 1
                    type: string
                  supportsArtifacts:
                    description: SupportsArtifacts declares harness v1 artifact support.
                      v1 only.
                    type: boolean
                  supportsCancel:
                    description: SupportsCancel declares harness v1 turn cancellation
                      support. v1 only.
                    type: boolean
                  supportsContinuation:
                    description: SupportsContinuation declares harness v1 brokered
                      continuation support. v1 only.
                    type: boolean
                  supportsDrain:
                    description: SupportsDrain must exactly match the static v2 capability
                      claim.
                    type: boolean
                  supportsPublicationFinalization:
                    description: SupportsPublicationFinalization must exactly match
                      the static v2 capability claim.
                    type: boolean
                  supportsRuntimeSessions:
                    description: SupportsRuntimeSessions declares harness v1 runtime
                      session support. v1 only.
                    type: boolean
                  toolExecutionModes:
                    description: |-
                      ToolExecutionModes lists the harness v1 tool execution modes supported by
                      the runtime. v1 only; historically optional.
                    items:
                      description: AgentRuntimeToolExecutionMode describes how a harness
                        v1 runtime executes tools.
                      enum:
                      - observed
                      - brokered
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  workspaceGovernance:
                    description: WorkspaceGovernance must exactly match the static
                      v2 capability claim.
                    properties:
                      cancellationSettlement:
                        type: boolean
                      duplicateSafeMutations:
                        type: boolean
                      exactInstanceFencing:
                        type: boolean
                      mode:
                        description: Mode selects strict Orka governance or an explicit
                          trusted escape hatch.
                        enum:
                        - strict-governed
                        - trusted-non-governed
                        type: string
                      noDirectSCMPublication:
                        type: boolean
                      orkaOwnedCleanRoomPublication:
                        type: boolean
                      orkaOwnedWorkspaceDeltas:
                        type: boolean
                      promptScopedBrokerAuthorization:
                        type: boolean
                      trusted:
                        description: |-
                          Trusted must be true only for trusted-non-governed runtimes. Such runtimes
                          are ineligible for Tasks requesting strict read or write guarantees.
                        type: boolean
                    required:
                    - cancellationSettlement
                    - duplicateSafeMutations
                    - exactInstanceFencing
                    - mode
                    - noDirectSCMPublication
                    - orkaOwnedCleanRoomPublication
                    - orkaOwnedWorkspaceDeltas
                    - promptScopedBrokerAuthorization
                    - trusted
                    type: object
                    x-kubernetes-validations:
                    - message: trusted-non-governed runtimes must be explicitly marked
                        trusted
                      rule: self.mode != 'trusted-non-governed' || self.trusted
                    - message: strict-governed runtimes must not use the trusted non-governed
                        escape hatch
                      rule: self.mode != 'strict-governed' || !self.trusted
                    - message: strict-governed runtimes must claim every strict workspace
                        governance guarantee
                      rule: self.mode != 'strict-governed' || (self.orkaOwnedWorkspaceDeltas
                        && self.promptScopedBrokerAuthorization && self.noDirectSCMPublication
                        && self.orkaOwnedCleanRoomPublication && self.exactInstanceFencing
                        && self.duplicateSafeMutations && self.cancellationSettlement)
                    - message: trusted-non-governed runtimes must not claim strict
                        workspace guarantees
                      rule: self.mode != 'trusted-non-governed' || (!self.orkaOwnedWorkspaceDeltas
                        && !self.promptScopedBrokerAuthorization && !self.noDirectSCMPublication
                        && !self.orkaOwnedCleanRoomPublication && !self.exactInstanceFencing
                        && !self.duplicateSafeMutations && !self.cancellationSettlement)
                type: object
              clientAuth:
                description: ClientAuth configures controller authentication and mutation
                  authorization.
                properties:
                  bearerTokenSecretRef:
                    description: |-
                      BearerAuthRef points to the harness v1 bearer token Secret used for
                      mutating v1 harness endpoints. The referenced Secret must opt in with
                      label orka.ai/agent-runtime-auth=true, may set
                      orka.ai/agent-runtime-name=<runtime> to restrict use to one AgentRuntime,
                      and must set annotation orka.ai/agent-runtime-endpoint=<deployment.endpoint>
                      to bind the token to one endpoint.
                    properties:
                      key:
                        description: Key is the Secret data key containing the bearer
                          token.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  controllerBearerTokenSecretRef:
                    description: |-
                      ControllerBearerTokenSecretRef supplies the controller bearer token used by
                      authenticated v2 status and mutation endpoints.
                    properties:
                      key:
                        description: Key is the Secret data key.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret name in the AgentRuntime namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  operationCapabilitySecretRef:
                    description: |-
                      OperationCapabilitySecretRef supplies the HMAC secret used to bind every
                      v2 mutation to its exact fence, operation identity, request digest, and expiry.
                    properties:
                      key:
                        description: Key is the Secret data key.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret name in the AgentRuntime namespace.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - key
                    - name
                    type: object
                type: object
                x-kubernetes-validations:
                - message: legacy v1 and v2 client auth shapes are mutually exclusive
                  rule: '!(has(self.bearerTokenSecretRef) && (has(self.controllerBearerTokenSecretRef)
                    || has(self.operationCapabilitySecretRef)))'
                - message: v2 client auth requires both controllerBearerTokenSecretRef
                    and operationCapabilitySecretRef
                  rule: has(self.controllerBearerTokenSecretRef) == has(self.operationCapabilitySecretRef)
                - message: client auth requires either the v1 or the v2 credential
                    shape
                  rule: has(self.bearerTokenSecretRef) || has(self.controllerBearerTokenSecretRef)
              contractVersion:
                description: |-
                  ContractVersion is the Orka harness contract this runtime must implement.
                  It is immutable once set. Required for new registrations through
                  fail-closed admission; the bridge schema tolerates omission only on
                  unchanged stored objects while execution admission is closed.
                enum:
                - orka.harness.v1
                - orka.harness.v2
                type: string
              deployment:
                description: Deployment identifies the runtime endpoint provider.
                properties:
                  endpoint:
                    description: |-
                      Endpoint is the base URL for an external harness service. It must not
                      contain credentials, query parameters, or fragments.
                    pattern: ^https?://[^\s@?#]+$
                    type: string
                  mode:
                    description: |-
                      Mode is the deployment mode. External AgentRuntime registrations are not
                      scaled or recycled by Orka.
                    enum:
                    - external-endpoint
                    type: string
                required:
                - endpoint
                - mode
                type: object
            required:
            - clientAuth
            - deployment
            type: object
            x-kubernetes-validations:
            - message: contractVersion is immutable once set
              rule: '!has(oldSelf.contractVersion) || (has(self.contractVersion) &&
                self.contractVersion == oldSelf.contractVersion)'
            - message: orka.harness.v1 requires the legacy bearerTokenSecretRef client
                auth shape
              rule: '!has(self.contractVersion) || self.contractVersion != ''orka.harness.v1''
                || (has(self.clientAuth.bearerTokenSecretRef) && !has(self.clientAuth.controllerBearerTokenSecretRef)
                && !has(self.clientAuth.operationCapabilitySecretRef))'
            - message: orka.harness.v1 capabilities must not carry v2 capability fields
              rule: '!has(self.contractVersion) || self.contractVersion != ''orka.harness.v1''
                || !has(self.capabilities) || (!has(self.capabilities.runtimeInstanceID)
                && !has(self.capabilities.profile) && !has(self.capabilities.mcpPolicy)
                && !has(self.capabilities.limits) && !has(self.capabilities.workspaceGovernance)
                && !has(self.capabilities.supportsDrain) && !has(self.capabilities.supportsPublicationFinalization))'
            - message: orka.harness.v2 requires the v2 controller bearer and operation
                capability client auth shape
              rule: '!has(self.contractVersion) || self.contractVersion != ''orka.harness.v2''
                || (has(self.clientAuth.controllerBearerTokenSecretRef) && has(self.clientAuth.operationCapabilitySecretRef)
                && !has(self.clientAuth.bearerTokenSecretRef))'
            - message: orka.harness.v2 requires pinned instance, profile, MCP policy,
                limits, and workspace governance capabilities
              rule: '!has(self.contractVersion) || self.contractVersion != ''orka.harness.v2''
                || (has(self.capabilities) && has(self.capabilities.runtimeInstanceID)
                && has(self.capabilities.profile) && has(self.capabilities.mcpPolicy)
                && has(self.capabilities.limits) && has(self.capabilities.workspaceGovernance))'
            - message: orka.harness.v2 capabilities must not carry v1 capability fields
              rule: '!has(self.contractVersion) || self.contractVersion != ''orka.harness.v2''
                || !has(self.capabilities) || (!has(self.capabilities.toolExecutionModes)
                && !has(self.capabilities.brokeredToolClasses) && !has(self.capabilities.supportsCancel)
                && !has(self.capabilities.supportsRuntimeSessions) && !has(self.capabilities.supportsContinuation)
                && !has(self.capabilities.supportsArtifacts))'
          status:
            description: AgentRuntimeStatus defines the observed state of an AgentRuntime.
            properties:
              conditions:
                description: Conditions represent the current state of the AgentRuntime.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastValidated:
                description: LastValidated is the timestamp of the last readiness
                  probe.
                format: date-time
                type: string
              message:
                description: Message provides sanitized readiness context.
                type: string
              observedAuthRefResourceVersion:
                description: |-
                  ObservedAuthRefResourceVersion is the resourceVersion of the harness v1
                  bearer auth Secret used for the last v1 readiness probe. It is non-secret
                  metadata used to decide when token rotation requires a fresh authenticated
                  conformance turn. v2 probes use the two v2 auth resource-version fields.
                type: string
              observedCapabilities:
                description: ObservedCapabilities contains sanitized capabilities
                  from the last probe.
                properties:
                  acpVersion:
                    type: string
                  adapterDigest:
                    type: string
                  adapterName:
                    type: string
                  brokeredToolClasses:
                    items:
                      description: |-
                        AgentRuntimeBrokeredToolClass classifies Tool CRDs. It is shared by the Tool
                        API and by harness v1 AgentRuntime capability declarations.
                      enum:
                      - read
                      - write
                      - coordination
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  controllerEpoch:
                    format: int64
                    type: integer
                  lifecycle:
                    type: string
                  limits:
                    description: Limits records the v2 protocol bounds. It is absent
                      for harness v1.
                    properties:
                      maxBufferedEvents:
                        format: int32
                        minimum: 1
                        type: integer
                      maxConcurrentPrompts:
                        format: int32
                        minimum: 1
                        type: integer
                      maxEventLineBytes:
                        format: int32
                        minimum: 1
                        type: integer
                      maxPendingPermissions:
                        format: int32
                        minimum: 1
                        type: integer
                      maxPromptLeaseMillis:
                        format: int64
                        minimum: 1
                        type: integer
                      maxRequestBytes:
                        format: int32
                        minimum: 1
                        type: integer
                      maxResidentSessions:
                        format: int32
                        minimum: 1
                        type: integer
                      maxTerminalResultBytes:
                        format: int32
                        minimum: 1
                        type: integer
                      maxUpdateEventsPerSecond:
                        format: int32
                        minimum: 1
                        type: integer
                      maxWorkspaceDeltaBytes:
                        format: int64
                        minimum: 1
                        type: integer
                      minPromptLeaseMillis:
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - maxBufferedEvents
                    - maxConcurrentPrompts
                    - maxEventLineBytes
                    - maxPendingPermissions
                    - maxPromptLeaseMillis
                    - maxRequestBytes
                    - maxResidentSessions
                    - maxTerminalResultBytes
                    - maxUpdateEventsPerSecond
                    - maxWorkspaceDeltaBytes
                    - minPromptLeaseMillis
                    type: object
                  maxConcurrentTurns:
                    type: integer
                  maxOutputBytes:
                    format: int64
                    type: integer
                  maxTurnSeconds:
                    type: integer
                  mcpToolDescriptorDigest:
                    description: |-
                      MCPToolDescriptorDigest records the exact derived descriptor set sent by
                      the controller during the most recent v2 conformance probe.
                    type: string
                  model:
                    type: string
                  profileDigestSchemaVersion:
                    format: int32
                    type: integer
                  protocolVersion:
                    type: string
                  providerKind:
                    type: string
                  runtimeInstanceID:
                    type: string
                  runtimeName:
                    type: string
                  runtimePoolGeneration:
                    format: int64
                    type: integer
                  runtimePoolUID:
                    type: string
                  runtimeProfileDigest:
                    type: string
                  runtimeVersion:
                    type: string
                  supervisorBootID:
                    type: string
                  supportsArtifacts:
                    type: boolean
                  supportsCancel:
                    type: boolean
                  supportsContinuation:
                    type: boolean
                  supportsDrain:
                    type: boolean
                  supportsPublicationFinalization:
                    type: boolean
                  supportsRuntimeSessions:
                    type: boolean
                  supportsSuspend:
                    type: boolean
                  supportsWorkspaceSnapshot:
                    type: boolean
                  toolExecutionModes:
                    items:
                      description: AgentRuntimeToolExecutionMode describes how a harness
                        v1 runtime executes tools.
                      enum:
                      - observed
                      - brokered
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  transport:
                    type: string
                  workspaceGovernance:
                    description: WorkspaceGovernance records the v2 workspace guarantees.
                      It is absent for harness v1.
                    properties:
                      cancellationSettlement:
                        type: boolean
                      duplicateSafeMutations:
                        type: boolean
                      exactInstanceFencing:
                        type: boolean
                      mode:
                        description: Mode selects strict Orka governance or an explicit
                          trusted escape hatch.
                        enum:
                        - strict-governed
                        - trusted-non-governed
                        type: string
                      noDirectSCMPublication:
                        type: boolean
                      orkaOwnedCleanRoomPublication:
                        type: boolean
                      orkaOwnedWorkspaceDeltas:
                        type: boolean
                      promptScopedBrokerAuthorization:
                        type: boolean
                      trusted:
                        description: |-
                          Trusted must be true only for trusted-non-governed runtimes. Such runtimes
                          are ineligible for Tasks requesting strict read or write guarantees.
                        type: boolean
                    required:
                    - cancellationSettlement
                    - duplicateSafeMutations
                    - exactInstanceFencing
                    - mode
                    - noDirectSCMPublication
                    - orkaOwnedCleanRoomPublication
                    - orkaOwnedWorkspaceDeltas
                    - promptScopedBrokerAuthorization
                    - trusted
                    type: object
                    x-kubernetes-validations:
                    - message: trusted-non-governed runtimes must be explicitly marked
                        trusted
                      rule: self.mode != 'trusted-non-governed' || self.trusted
                    - message: strict-governed runtimes must not use the trusted non-governed
                        escape hatch
                      rule: self.mode != 'strict-governed' || !self.trusted
                    - message: strict-governed runtimes must claim every strict workspace
                        governance guarantee
                      rule: self.mode != 'strict-governed' || (self.orkaOwnedWorkspaceDeltas
                        && self.promptScopedBrokerAuthorization && self.noDirectSCMPublication
                        && self.orkaOwnedCleanRoomPublication && self.exactInstanceFencing
                        && self.duplicateSafeMutations && self.cancellationSettlement)
                    - message: trusted-non-governed runtimes must not claim strict
                        workspace guarantees
                      rule: self.mode != 'trusted-non-governed' || (!self.orkaOwnedWorkspaceDeltas
                        && !self.promptScopedBrokerAuthorization && !self.noDirectSCMPublication
                        && !self.orkaOwnedCleanRoomPublication && !self.exactInstanceFencing
                        && !self.duplicateSafeMutations && !self.cancellationSettlement)
                type: object
              observedControllerAuthRefResourceVersion:
                description: |-
                  ObservedControllerAuthRefResourceVersion is the bearer Secret version used
                  by the last successful or failed authenticated conformance probe.
                type: string
              observedGeneration:
                description: ObservedGeneration is the latest generation reconciled
                  into this status.
                format: int64
                type: integer
              observedOperationCapabilityRefResourceVersion:
                description: |-
                  ObservedOperationCapabilityRefResourceVersion is the HMAC Secret version used
                  by the last mutation conformance probe.
                type: string
              ready:
                description: Ready indicates the runtime passed the configured Orka
                  readiness checks.
                type: boolean
            type: object
        type: object
