metadata:
  labels:
    app.kubernetes.io/component: scm-egress-proxy
    app.kubernetes.io/name: orka
  name: orka-scm-egress-proxy
  namespace: orka-system
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: 0.0.0.0/0
        except:
        - 0.0.0.0/8
        - 10.0.0.0/8
        - 100.64.0.0/10
        - 127.0.0.0/8
        - 169.254.0.0/16
        - 172.16.0.0/12
        - 192.0.0.0/24
        - 192.0.2.0/24
        - 192.88.99.0/24
        - 192.168.0.0/16
        - 198.18.0.0/15
        - 198.51.100.0/24
        - 203.0.113.0/24
        - 224.0.0.0/4
        - 240.0.0.0/4
  - ports:
    - port: 443
      protocol: TCP
    to:
    - ipBlock:
        cidr: ::/0
        except:
        - ::/128
        - ::1/128
        - 64:ff9b::/96
        - 64:ff9b:1::/48
        - 100::/64
        - 100:0:0:1::/64
        - 2001::/32
        - 2001:2::/48
        - 2001:db8::/32
        - 2001:10::/28
        - 2001:20::/28
        - 2002::/16
        - 3fff::/20
        - 5f00::/16
        - fc00::/7
        - fe80::/10
        - ff00::/8
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: workspace-publisher
