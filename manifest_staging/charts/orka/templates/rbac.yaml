{{- if .Values.rbac.create -}}
{{- $harnessV2 := eq .Values.controller.mode "harness-v2" -}}
# Controller tenant Role. The release namespace is also the immutable watch namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orka.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
rules:
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks", "tools", "agents", "agentruntimes", "runtimepools", "promptattempts", "runtimesessioncontrols", "publications", "controllerepochs", "externaleffects", "providers", "skills", "repositorymonitors", "repositoryscans", "substrateactorpools", "outboundaccesspolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["core.orka.ai"]
    resources: ["sessions"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks/status", "tools/status", "agents/status", "agentruntimes/status", "runtimepools/status", "promptattempts/status", "runtimesessioncontrols/status", "publications/status", "controllerepochs/status", "externaleffects/status", "providers/status", "skills/status", "repositorymonitors/status", "repositoryscans/status", "substrateactorpools/status", "outboundaccesspolicies/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks/finalizers", "tools/finalizers", "agents/finalizers", "agentruntimes/finalizers", "runtimepools/finalizers", "promptattempts/finalizers", "runtimesessioncontrols/finalizers", "publications/finalizers", "controllerepochs/finalizers", "externaleffects/finalizers", "providers/finalizers", "skills/finalizers", "repositorymonitors/finalizers", "repositoryscans/finalizers", "substrateactorpools/finalizers", "outboundaccesspolicies/finalizers"]
    verbs: ["update"]
  {{- if $harnessV2 }}
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gateways", "gatewaybindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gateways/status", "gatewaybindings/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gateways/finalizers", "gatewaybindings/finalizers"]
    verbs: ["update"]
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaces", "executionworkspaceclasses", "executionworkspacepools"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # The workspace admission policies gate spec.coreAdmission writes on the
  # "admit" verb and class-backed Task/Tool creation on the "use" verb, so the
  # controller needs both or fail-closed admission rejects its own writes.
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaces"]
    verbs: ["admit"]
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaceclasses"]
    verbs: ["use"]
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaces/status", "executionworkspaceclasses/status", "executionworkspacepools/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaces/finalizers", "executionworkspaceclasses/finalizers"]
    verbs: ["update"]
  # Class resolution reads the namespaced RuntimeWorkspaceProfile the class's
  # parametersRef selects; without it a Helm-installed controller cannot
  # resolve any classRef Task.
  - apiGroups: ["acp.workspace.orka.ai"]
    resources: ["runtimeworkspaceprofiles"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxtemplates", "sandboxwarmpools"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: ["ate.dev"]
    resources: ["actortemplates"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  {{- end }}
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/status", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update"]
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    # The Events-v1 retention recorder writes Events; create and patch are
    # required or every Retention Event is rejected by the API server.
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orka.controllerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orka.controllerName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orka.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if $harnessV2 }}
---
# Runtime child resources are confined to the v2 installation's runtime namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orka.controllerName" . }}-runtime
  namespace: {{ .Values.controller.acpRuntime.namespace }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxtemplates", "sandboxwarmpools"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "patch", "update", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orka.controllerName" . }}-runtime
  namespace: {{ .Values.controller.acpRuntime.namespace }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orka.controllerName" . }}-runtime
subjects:
  - kind: ServiceAccount
    name: {{ include "orka.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# Minimal cluster-scoped controller authority. Namespaced workload access is never bound here.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orka.controllerClusterRoleName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames:
      - {{ .Release.Namespace }}
      {{- if $harnessV2 }}
      - {{ .Values.controller.acpRuntime.namespace }}
      {{- end }}
    verbs: ["get"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames:
      - {{ include "orka.aiWorkerClusterRoleName" . }}
      - {{ include "orka.vendorWorkerClusterRoleName" . }}
      - {{ include "orka.containerWorkerClusterRoleName" . }}
    verbs: ["bind"]
  {{- if $harnessV2 }}
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["tasks.core.orka.ai", "gatewayclasses.gateway.orka.ai", "gateways.gateway.orka.ai", "gatewaybindings.gateway.orka.ai"]
    verbs: ["get"]
  - apiGroups: ["core.orka.ai"]
    resources: ["branchclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["core.orka.ai"]
    resources: ["branchclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["core.orka.ai"]
    resources: ["branchclaims/finalizers"]
    verbs: ["update"]
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gatewayclasses/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gatewayclasses/finalizers"]
    verbs: ["update"]
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaceproviders"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaceproviders/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaceproviders/finalizers"]
    verbs: ["update"]
  # Provider deletion protection scans namespaced references across all
  # namespaces. The namespaced manager RoleBinding cannot authorize those lists.
  - apiGroups: ["workspace.orka.ai"]
    resources: ["executionworkspaceclasses", "executionworkspacepools", "executionworkspaces"]
    verbs: ["list"]
  # Provider advertisement and class resolution read the cluster-scoped
  # RuntimeProviderConfig selected by the provider's parametersRef.
  - apiGroups: ["acp.workspace.orka.ai"]
    resources: ["runtimeproviderconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orka.controllerClusterRoleName" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orka.controllerClusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "orka.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Client Role (for API access in this installation's namespace)
{{- if .Values.client.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "orka.fullname" . }}-client
  namespace: {{ include "orka.clientNamespace" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
rules:
  # Task permissions
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["core.orka.ai"]
    resources: ["tasks/status"]
    verbs: ["get"]

  # RepositoryMonitor permissions
  - apiGroups: ["core.orka.ai"]
    resources: ["repositorymonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["core.orka.ai"]
    resources: ["repositorymonitors/status"]
    verbs: ["get"]

  # Tool permissions (read-only)
  - apiGroups: ["core.orka.ai"]
    resources: ["tools"]
    verbs: ["get", "list", "watch"]

  # Agent permissions (read-only)
  - apiGroups: ["core.orka.ai"]
    resources: ["agents"]
    verbs: ["get", "list", "watch"]

  # Skill permissions (read-only)
  - apiGroups: ["core.orka.ai"]
    resources: ["skills"]
    verbs: ["get", "list", "watch"]

  # Provider permissions (read-only). The dashboard Chat provider picker calls
  # GET /providers, which passes a SubjectAccessReview for this resource, and
  # native chat exists in every controller mode.
  - apiGroups: ["core.orka.ai"]
    resources: ["providers"]
    verbs: ["get", "list", "watch"]

  # Virtual Session API permissions
  - apiGroups: ["core.orka.ai"]
    resources: ["sessions"]
    verbs: ["get", "list", "delete"]

  {{- if $harnessV2 }}
  # Generic gateway resource permissions (read-only; durable ledgers use the Orka REST API).
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gateways", "gatewaybindings"]
    verbs: ["get", "list", "watch"]

  # ACP runtime resource permissions (read-only; the dashboard Runtimes page
  # and `orka runtime-pool` / `orka agent-runtime` reads pass a
  # SubjectAccessReview for these resources).
  - apiGroups: ["core.orka.ai"]
    resources: ["runtimepools", "agentruntimes"]
    verbs: ["get", "list", "watch"]
  {{- end }}

  # ConfigMap permissions (for results and sessions)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "orka.fullname" . }}-client
  namespace: {{ include "orka.clientNamespace" . }}
  labels:
    {{- include "orka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "orka.fullname" . }}-client
subjects:
  - kind: ServiceAccount
    name: {{ .Values.client.name }}
    namespace: {{ include "orka.clientNamespace" . }}
{{- if $harnessV2 }}
---
# GatewayClass is cluster-scoped, so isolated clients need a separate ClusterRoleBinding for read access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "orka.fullname" . }}-gatewayclass-viewer
  labels:
    {{- include "orka.labels" . | nindent 4 }}
rules:
  - apiGroups: ["gateway.orka.ai"]
    resources: ["gatewayclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "orka.fullname" . }}-gatewayclass-viewer
  labels:
    {{- include "orka.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "orka.fullname" . }}-gatewayclass-viewer
subjects:
  - kind: ServiceAccount
    name: {{ .Values.client.name }}
    namespace: {{ include "orka.clientNamespace" . }}
{{- end }}
{{- end }}
---
