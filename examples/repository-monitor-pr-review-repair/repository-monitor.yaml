apiVersion: core.orka.ai/v1alpha1
kind: RepositoryMonitor
metadata:
  name: pr-review-repair
spec:
  provider: github
  repoURL: https://github.com/example-org/example-repo
  branch: main
  # Four distinct Secrets. Orka rejects the monitor if any is missing or if two
  # of them name the same Secret. See website/docs/guides/repository-monitors.md.
  readCredentialRef:            # clone/read the source repository
    name: orka-monitor-source-read
  publicationReadCredentialRef: # preflight + independent verification of the target
    name: orka-monitor-publication-read
  publicationCredentialRef:     # push the branch (compare-and-swap only)
    name: orka-monitor-publication
  forgeCredentialRef:           # GitHub API calls the controller makes itself
    name: orka-monitor-forge
  targets:
    pullRequests:
      enabled: true
      includeDrafts: false
      maxPerRun: 20
  triggers:
    github:
      labels:
        enabled: true
        consumeCommandLabels: true
        requireActorPermission: write
        pullRequests:
          review: orka:review
          fix: orka:fix
          fixCI: orka:fix-ci
          updateBranch: orka:update-branch
          automerge: orka:automerge
          stop: orka:stop
          resume: orka:resume
  agents:
    reviewer:
      name: pr-reviewer
    repairer:
      name: pr-repairer
  review:
    exactEventEnabled: true
    publish:
      enabled: true
      event: COMMENT
      mode: summary_with_inline_findings
  repair:
    enabled: true
    maxRepairsPerPR: 5
    maxRepairsPerHead: 2
  automerge:
    enabled: false
    requireGlobalMergeGate: true
    allowedMergeMethods:
      - squash
  policy:
    protectedLabels:
      - security
      - security-sensitive
    pauseLabels:
      - orka:pause
      - blocked
  validation:
    image: ghcr.io/example-org/example-repo-validation@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
