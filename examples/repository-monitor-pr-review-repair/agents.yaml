apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: pr-reviewer
spec:
  model:
    name: claude-sonnet-4.6
  runtime:
    type: claude
    contractVersion: orka.harness.v2
    defaultMaxTurns: 50
    defaultAllowedTools:
      - Read
      - Glob
      - Grep
  systemPrompt:
    inline: |
      Review exact pull request heads and return only Orka's structured review JSON.
---
apiVersion: core.orka.ai/v1alpha1
kind: Agent
metadata:
  name: pr-repairer
spec:
  model:
    name: gpt-5.4
  runtime:
    type: codex
    contractVersion: orka.harness.v2
    defaultMaxTurns: 100
    defaultAllowedTools:
      - Read
      - Write
      - Edit
      - Bash
      - Glob
      - Grep
  systemPrompt:
    inline: |
      Repair PR findings selected by Orka RepositoryMonitor. Keep changes scoped and never merge the PR.
