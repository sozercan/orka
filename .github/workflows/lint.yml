name: Lint

on:
  workflow_dispatch:
  push:
    # PR branches are linted by the pull_request event. Keep push coverage on
    # main without running the same branch change twice.
    branches:
      - main
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - ".agents/**"
      - ".claude/**"
      - "website/**"
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          check-latest: true

      - name: Create UI embed stub
        run: make ensure-ui-embed

      - name: Run linter
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          install-mode: goinstall
          # GitHub refuses REST PR diffs over 20,000 lines. Compare revisions
          # locally so large PRs still filter out pre-existing lint findings.
          args: --new-from-rev=${{ github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}

  ui-lint:
    name: UI Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run UI linter
        run: bun run lint
