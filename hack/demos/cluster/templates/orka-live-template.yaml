# SandboxTemplate for the demo cluster's agent-sandbox execution workspaces.
# install-agent-sandbox.sh substitutes the digest-pinned runtime image and
# applies it in the controller's watched namespace; workspace-backed ACP
# RuntimePools (Task.spec.execution.workspace, provider agent-sandbox) render
# SandboxClaims against it. Git read/publication credentials never enter the
# sandbox: the clean-room Workspace/Publisher owns SCM publication.
apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  name: orka-live-template
  namespace: demo-magic
  labels:
    orka.ai/demo: sandbox-template
spec:
  networkPolicyManagement: Unmanaged
  service: true
  podTemplate:
    spec:
      dnsPolicy: ClusterFirst
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: agent
          image: REPLACE_RUNTIME_IMAGE
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/sandbox-runtime"]
          ports:
            - containerPort: 8888
              protocol: TCP
          # Burstable QoS so the kubelet doesn't pick the sandbox pod first
          # under memory pressure. Codex running inside the sandbox can spike
          # well past a BestEffort budget during long-running turns; without
          # explicit limits the kubelet OOMKilled the pod mid-turn, which the
          # router then surfaced as 502 "Connection refused" to the worker.
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: app
              mountPath: /app
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          emptyDir: {}
        - name: app
          emptyDir: {}
        - name: tmp
          emptyDir: {}
